#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"


[build]
  entrypoint = "tmp/main.exe"
  cmd = "go build -o ./tmp/main.exe ./cmd/server"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp"]
  delay = 1000
  stop_on_error = true

[run]
  cmd = "$env:APP_ENV='dev'; .\\tmp\\main.exe"
